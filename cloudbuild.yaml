steps:
- name: 'gcr.io/cloud-builders/docker'
  args: [ 'build', '-t', 'gcr.io/$PROJECT_ID/medical-search-pro-agent', '.' ]
- name: 'gcr.io/cloud-builders/docker'
  args: [ 'push', 'gcr.io/$PROJECT_ID/medical-search-pro-agent' ]
- name: 'gcr.io/cloud-builders/gcloud'
  args:
  - 'run'
  - 'deploy'
  - 'medical-search-pro-agent'
  - '--image'
  - 'gcr.io/$PROJECT_ID/medical-search-pro-agent'
  - '--region'
  - '${_GOOGLE_CLOUD_LOCATION}'
  - '--platform'
  - 'managed'
  - '--allow-unauthenticated'
  - '--set-env-vars'
  - 'GOOGLE_GENAI_USE_VERTEXAI=${_GOOGLE_GENAI_USE_VERTEXAI},GOOGLE_CLOUD_PROJECT=$PROJECT_ID,GOOGLE_CLOUD_LOCATION=${_GOOGLE_CLOUD_LOCATION},GOOGLE_CLOUD_STAGING_BUCKET=${_GOOGLE_CLOUD_STAGING_BUCKET},SMTP_HOST=${_SMTP_HOST},SMTP_PORT=${_SMTP_PORT},SMTP_USER=${_SMTP_USER},SMTP_PASSWORD=${_SMTP_PASSWORD},NCBI_API_KEY=${_NCBI_API_KEY}'
images:
- 'gcr.io/$PROJECT_ID/medical-search-pro-agent'
